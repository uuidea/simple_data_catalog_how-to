site:
  title: Data Management for Data Publishers (EPUB)
  url: https://uuidea.github.io/simple_data_catalog_how-to

content:
  sources:
    - url: .
      branches: HEAD

asciidoc:
  attributes:
    page-pagination: ''
    experimental: ''
    kroki-fetch-diagram: true
    kroki-default-format: svg@
    kroki-server-url: http://kroki.uuidea.eu:8000/
    ebook-format: epub3
    ebook-validate: true
    ebook-remove-attributes: kroki-fetch-diagram,kroki-default-format,kroki-server-url
  extensions:
    - asciidoctor-kroki
    - '@djencks/asciidoctor-mathjax'

# Note: Use npm run build:epub instead of this playbook  
# This playbook is kept for reference but we use asciidoctor-epub3 directly

output:
  dir: ./epub