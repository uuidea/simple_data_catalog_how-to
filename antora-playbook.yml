site:
  title: Data Management for Data Publishers
  url: https://uuidea.github.io/simple_data_catalog_how-to

content:
  sources:
    - url: .
      branches: HEAD
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: supplemental-ui  

asciidoc:
  attributes:
    page-pagination: ''
    experimental: ''
    kroki-fetch-diagram: true # Render images in browser. Makes building much faster which is convenient for local development.
    kroki-default-format: svg@
    kroki-server-url: http://kroki.uuidea.eu:8000/
    mermaid-render-mode: server # Enable server-side Mermaid rendering for offline PDF/EPUB
    imagesdir: images # Standard Antora images directory
  extensions:
    - asciidoctor-kroki
    - '@djencks/asciidoctor-mathjax'

    # - asciidoctor-mermaid # Add this line to enable Mermaid support

antora:
  extensions:
    # mermaid-preprocessor disabled - multi-format-generator handles SVG generation for PDF/EPUB
    # HTML builds use client-side mermaid via @sntke/antora-mermaid-extension
    - require: '@antora/lunr-extension'
      index_latest_only: true
    - require: '@sntke/antora-mermaid-extension' # <1>
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs # <2>
      script_stem: header-scripts # <3>
      mermaid_initialize_options: # <4>
        start_on_load: true
    - require: './extensions/multi-format-generator'
      formats: ['pdf', 'epub']  # Explicit format list required
      pdf:
        output_dir: 'pdf'
        theme: 'default'
      epub:
        output_dir: 'epub'
        format: 'epub3'
        validate: true



output:
  dir: ./build/site