<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- SEO tags -->
    {% seo %}
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    
    <!-- Custom fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="sidebar-visible">
    <div class="site-container">
      <!-- Sidebar -->
      {% include sidebar.html %}
      
      <!-- Main Content -->
      <div class="main-content">
        <header class="site-header">
          <button class="sidebar-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div class="header-content">
            {% if page.title %}
              <h1>{{ page.title }}</h1>
            {% endif %}
          </div>
        </header>
        
        <main class="content-area">
          <div class="content-wrapper">
            {{ content }}
          </div>
        </main>
        
        <footer class="site-footer">
          <div class="footer-content">
            This site is open source. <a href="{{ site.github.repository_url }}/edit/{{ site.github.default_branch }}/{{ page.path }}">Improve this page</a>.
          </div>
        </footer>
      </div>
    </div>
    
    <!-- JavaScript -->
    <script src="{{ "/assets/js/sidebar.js" | relative_url }}"></script>
  </body>
</html>
